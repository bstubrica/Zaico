x-app-environment: &app-environment
  APP_NAME: Zaiko
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8000}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: es
  APP_FAKER_LOCALE: es_ES
  APP_MAINTENANCE_DRIVER: file
  APP_KEY: ${APP_KEY:-}
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-zaico}
  DB_USERNAME: ${POSTGRES_USER:-zaico}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_PATH: /
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: "hello@example.com"
  MAIL_FROM_NAME: Zaiko
  TZ: America/Caracas

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zaico/app:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    stop_grace_period: 30s

  scheduler:
    image: zaico/app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zaico}
      POSTGRES_USER: ${POSTGRES_USER:-zaico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      TZ: UTC
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb

  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: zaico/backup:latest
    profiles: ["backup"]
    restart: "no"
    user: "0:0"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-zaico}
      DB_USERNAME: ${POSTGRES_USER:-zaico}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      BACKUP_DIR: /backups
      BACKUP_RETENCION_DIAS: "14"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/backups

volumes:
  storage:
  dbdata:
  backups:
